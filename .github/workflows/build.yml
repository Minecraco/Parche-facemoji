name: Build patches bundle

# Compila el .mpp en cada push y lo deja como artefacto descargable en la pestana
# Actions del repositorio. Asi se puede probar el bundle sin esperar a una release.
# Las releases estables las sigue generando release.yml (semantic-release) en main.

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build patches
        id: build
        continue-on-error: true
        env:
          # El plugin app.morphe.patches se descarga desde GitHub Packages.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./gradlew buildAndroid --no-daemon 2>&1 | tee build.log

      # TEMPORAL: publica el error de compilacion como issue para poder diagnosticarlo
      # desde fuera del runner. Se elimina en cuanto la compilacion este verde.
      - name: Publicar log de error
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          tail -c 60000 build.log > log-tail.txt
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "ci: fallo de compilacion" \
            --body-file log-tail.txt || true

      - name: Fallar si la compilacion fallo
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload .mpp
        uses: actions/upload-artifact@v4
        with:
          name: parche-facemoji-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
          retention-days: 30
