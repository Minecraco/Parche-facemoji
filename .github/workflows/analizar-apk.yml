name: Analizar APK de Facemoji

on:
  push:
    paths:
      - 'analisis/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  APKM_FILE_ID: 1jddpsPYRfpOKYaqKvEhuMeYjRHQacOZR

jobs:
  analizar:
    name: Analizar la APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install gdown androguard

      - name: Descargar la APK del Drive
        run: |
          set +e
          gdown "https://drive.google.com/uc?id=${APKM_FILE_ID}" -O facemoji.apkm 2>&1 | tail -1

      - name: Clases internas de SettingsActivity
        if: hashFiles('facemoji.apkm') != ''
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --clases-regex '^Lcom/baidu/simeji/settings/SettingsActivity[^;]*;' \
            | head -n 300 | tee analisis/b1-settingsactivity-clases.txt || true

      - name: Metodos de SettingsActivity
        if: hashFiles('facemoji.apkm') != ''
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --metodos '^Lcom/baidu/simeji/settings/SettingsActivity[^;]*;' \
            | head -n 500 | tee analisis/b2-settingsactivity-metodos.txt || true

      - name: Quien construye la lista (RecyclerView)
        if: hashFiles('facemoji.apkm') != ''
        timeout-minutes: 30
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --llamadas 'setLayoutManager|setAdapter' \
            --llamadas-clases '^Lcom/baidu/simeji/settings/' \
            | head -n 300 | tee analisis/b3-lista-recycler.txt || true

      - name: Bytecode de SettingsActivity
        if: hashFiles('facemoji.apkm') != ''
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --smali '^Lcom/baidu/simeji/settings/SettingsActivity' \
            | head -n 2500 | tee analisis/b4-smali-settingsactivity.txt || true

      - name: Publicar los informes en la rama
        if: always()
        run: |
          rm -f facemoji.apkm
          git config user.name "analisis-apk"
          git config user.email "noreply@example.com"
          git add analisis
          git commit -m "chore: informe de analisis de SettingsActivity" || echo "sin cambios"
          git push
