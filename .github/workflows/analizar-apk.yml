name: Analizar APK de Facemoji

on:
  push:
    paths:
      - 'analisis/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  APKM_FILE_ID: 1jddpsPYRfpOKYaqKvEhuMeYjRHQacOZR

jobs:
  analizar:
    name: Analizar la APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install gdown androguard

      - name: Descargar la APK del Drive
        run: |
          set +e
          gdown "https://drive.google.com/uc?id=${APKM_FILE_ID}" -O facemoji.apkm 2>&1 | tail -1

      - name: Clases del paquete ef (ajustes)
        if: hashFiles('facemoji.apkm') != ''
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --clases-regex '^Lef/[^;]*;' \
            | head -n 300 | tee analisis/b5-clases-ef.txt || true

      - name: Metodos de SettingsMainFragment
        if: hashFiles('facemoji.apkm') != ''
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --metodos '^Lef/(l|n);' \
            | head -n 400 | tee analisis/b6-metodos-mainfragment.txt || true

      - name: Bytecode de SettingsMainFragment
        if: hashFiles('facemoji.apkm') != ''
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --smali '^Lef/n;' \
            | head -n 2000 | tee analisis/b7-smali-mainfragment.txt || true

      - name: Publicar los informes en la rama
        if: always()
        run: |
          rm -f facemoji.apkm
          git config user.name "analisis-apk"
          git config user.email "noreply@example.com"
          git add analisis
          git commit -m "chore: informe de analisis de SettingsActivity" || echo "sin cambios"
          git push
