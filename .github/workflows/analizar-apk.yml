name: Analizar APK de Facemoji

on:
  push:
    paths:
      - 'analisis/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  APKM_FILE_ID: 1jddpsPYRfpOKYaqKvEhuMeYjRHQacOZR

jobs:
  analizar:
    name: Analizar la APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install gdown androguard
      - name: Descargar la APK del Drive
        run: gdown "https://drive.google.com/uc?id=${APKM_FILE_ID}" -O facemoji.apkm 2>&1 | tail -1
      - name: Manifiesto
        run: python tools/dump_manifest.py facemoji.apkm > analisis/c2-manifiesto.txt 2>&1 || true
      - name: Clases del paquete skins (pantalla de ajustes)
        run: python tools/analizar_apk.py facemoji.apkm --clases 'com/baidu/simeji/skins' > analisis/c9-clases-skins.txt 2>&1 || true
      - name: Bytecode del manejador de filas de ajustes
        run: python tools/analizar_apk.py facemoji.apkm --smali '^Lcom/baidu/simeji/skins/(v0|n0|o0|p0);$' > analisis/d1-smali-ajustes.txt 2>&1 || true
      - name: Modelo de fila La9/b
        run: python tools/analizar_apk.py facemoji.apkm --smali '^La9/b;$' > analisis/d3-modelo-fila.txt 2>&1 || true
      - name: SettingFragment completo
        run: |
          python tools/analizar_apk.py facemoji.apkm --metodos '^Lcom/baidu/simeji/skins/v0;$' > analisis/d4-settingfragment-metodos.txt 2>&1 || true
          python tools/analizar_apk.py facemoji.apkm --smali '^Lcom/baidu/simeji/skins/v0;$' > analisis/d5-settingfragment-smali.txt 2>&1 || true
      - name: Quien usa BaseItemUIData en skins
        run: python tools/analizar_apk.py facemoji.apkm --usa-clase 'Lcom/gclub/global/jetpackmvvm/base/BaseItemUIData;' > analisis/d2-usa-baseitem.txt 2>&1 || true
      - name: Quien hereda de la clase base de ajustes
        run: python tools/analizar_apk.py facemoji.apkm --subclases '^Lcom/baidu/simeji/components/b;' > analisis/c7-subclases-base.txt 2>&1 || true
      - name: Quien menciona FaqActivity
        run: python tools/analizar_apk.py facemoji.apkm --usa-clase 'Lcom/baidu/simeji/settings/FaqActivity;' > analisis/c8-usa-faq.txt 2>&1 || true
      - name: Clase base de la pantalla de ajustes
        run: python tools/analizar_apk.py facemoji.apkm --metodos '^Lcom/baidu/simeji/components/b;' > analisis/c3-base-metodos.txt 2>&1 || true
      - name: Bytecode de la clase base
        run: python tools/analizar_apk.py facemoji.apkm --smali '^Lcom/baidu/simeji/components/b;' > analisis/c4-base-smali.txt 2>&1 || true
      - name: Metodos con VIP en el nombre
        run: python tools/analizar_apk.py facemoji.apkm --metodos-nombre '^(is|get|set)?Vip|^(is|get|set)?VIP' > analisis/c5-metodos-vip.txt 2>&1 || true
      - name: Cadenas de suscripcion
        run: python tools/analizar_apk.py facemoji.apkm --buscar 'isVip|vip_status|vipStatus|is_vip|svip' > analisis/c6-cadenas-vip.txt 2>&1 || true
      - name: Publicar
        if: always()
        run: |
          rm -f facemoji.apkm
          git config user.name "analisis-apk"
          git config user.email "noreply@example.com"
          git add analisis
          git commit -m "chore: pantallas de ajustes basadas en preferencias" || echo "sin cambios"
          git push
