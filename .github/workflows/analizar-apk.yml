name: Analizar APK de Facemoji

# Puente temporal: GitHub Actions si tiene salida a Internet, incluido Google Drive,
# y el sandbox de desarrollo no. Este workflow descarga la APK publica del Drive,
# ejecuta tools/analizar_apk.py y hace commit de los informes en la rama actual
# para poder leerlos desde el repositorio.
#
# Se dispara solo cuando se anade/actualiza el fichero analisis/TRIGGER, para no
# ejecutarse en cada push. Se elimina cuando ya no haga falta.

on:
  push:
    paths:
      - 'analisis/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  APKM_FILE_ID: 1jddpsPYRfpOKYaqKvEhuMeYjRHQacOZR

jobs:
  analizar:
    name: Analizar la APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install gdown androguard

      - name: Descargar la APK del Drive
        run: |
          mkdir -p analisis
          gdown "${APKM_FILE_ID}" -O facemoji.apkm
          ls -l facemoji.apkm
          python - <<'EOF'
          import zipfile
          print("es un zip valido:", zipfile.is_zipfile("facemoji.apkm"))
          with zipfile.ZipFile("facemoji.apkm") as zf:
              print("entradas:", len(zf.infolist()))
          EOF

      - name: Informe de SDK
        run: python tools/analizar_apk.py facemoji.apkm --informe | tee analisis/01-sdk.txt

      - name: Comprobar huellas
        run: python tools/analizar_apk.py facemoji.apkm --comprobar | tee analisis/02-huellas.txt

      - name: Buscar codigo VIP
        run: python tools/analizar_apk.py facemoji.apkm --vip | tee analisis/03-vip.txt

      - name: Clases de anuncios de la app (sin distinguir mayusculas)
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --clases-regex '(?i)^L(com/baidu/simeji|com/gbu|sdk)/[^$]*(adm|ads|adv|splash|reward|interstitial|prompt)[^$]*;' \
            | head -n 800 | tee analisis/30-clases-ads.txt || true

      - name: Metodos de admaster y sugerencias patrocinadas
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --metodos '(?i)^Lcom/baidu/simeji/(admaster|plutus/adsuggestion)[^$]*;' \
            | head -n 1200 | tee analisis/31-ads-metodos.txt || true

      - name: Metodos de los beans de configuracion de anuncios
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --metodos '^Lcom/baidu/simeji/bean/(AdVideoConfig|AdPopupConfig|OnlyShowAdRewardConfig|AppendAdStrategyConfig);' \
            | head -n 800 | tee analisis/32-ads-config.txt || true

      - name: Clases propias relacionadas con VIP, usuario y cuenta
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --clases-regex '^L(com/baidu/simeji|sdk)/[^$]*(Vip|VIP|Premium|Member|Account|UserInfo|UserManager)[^$]*;' \
            | head -n 600 | tee analisis/33-vip-clases.txt || true

      - name: Metodos de los beans VIP
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --metodos '^L(com/baidu/simeji/coolfont/CoolFontBean|com/baidu/simeji/sticker/series/SeriesStickerItem|com/baidu/simeji/skins/content/itemdata/StickerItem|com/baidu/simeji/inputview/convenient/textbomb/TextBombBean|com/baidu/simeji/inapp/provider/vip/VIPContent|com/baidu/simeji/subscription/SubscriptionServerInfo);' \
            | head -n 900 | tee analisis/34-vip-metodos.txt || true

      - name: Paquete sdk completo
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --metodos '^Lsdk/[^$]*;' \
            | head -n 1200 | tee analisis/35-sdk-metodos.txt || true

      - name: Claves de preferencias y campos VIP
        run: |
          python tools/analizar_apk.py facemoji.apkm \
            --buscar 'vip_status|is_vip|vip_type|vip_expire|vip_end_time|user_vip|isVipSubscriber|app_key_kv' \
            | head -n 400 | tee analisis/36-vip-claves.txt || true

      - name: Publicar los informes en la rama
        run: |
          rm -f facemoji.apkm
          git config user.name "analisis-apk"
          git config user.email "noreply@example.com"
          git add analisis
          git commit -m "chore: informe de analisis de la APK de Facemoji" || echo "sin cambios"
          git push
